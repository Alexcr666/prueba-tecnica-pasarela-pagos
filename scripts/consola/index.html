<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment Service · Consola de verificación</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 fill=%22%230d5c4d%22/%3E%3Cpath d=%22M8 22V10h9a5 5 0 010 10h-6%22 stroke=%22white%22 stroke-width=%223%22 fill=%22none%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f2f1ec; --surface:#ffffff; --sunken:#f7f6f2; --ink:#15191e; --ink-2:#2c3238; --muted:#60666d; --faint:#8b9096;
  --rule:#d5d2c8; --rule-2:#e6e3db; --primary:#0d5c4d; --primary-ink:#ffffff; --primary-soft:#e2eee9;
  --ok:#1c7442; --ok-soft:#e4f1e8; --bad:#ac2a20; --bad-soft:#f8e6e3; --warn:#8f5b00; --warn-soft:#f6ecd6;
  --info:#4a3d99; --info-soft:#ebe8f7; --grey-soft:#eceae4;
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --k:#7a2e83; --s:#1d6b3b; --n:#1f4fb3; --b:#8f5b00; --z:#8b9096;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
.mono,code{font-family:var(--mono);font-size:12.5px}
a{color:var(--primary)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.005em}

/* ---------- cabecera ---------- */
.masthead{background:var(--ink);color:#e9eae6}
.masthead .in{max-width:1320px;margin:0 auto;padding:0 28px;height:52px;display:flex;align-items:center;gap:18px}
.mark{display:flex;align-items:center;gap:12px}
.mark svg{flex:none}
.mark b{font-family:var(--mono);font-size:12.5px;letter-spacing:.12em;font-weight:600}
.mark span{color:#a8adb1;font-size:13px;border-left:1px solid #3a4046;padding-left:12px}
.status{margin-left:auto;display:flex;gap:18px;font-size:12px;color:#b9bdc0;font-family:var(--mono)}
.status i{display:inline-block;width:7px;height:7px;margin-right:6px;background:#6b7177;vertical-align:1px}
.status i.up{background:#4fbf7f} .status i.down{background:#e0584d}
.tabs{background:var(--surface);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:30}
.tabs .in{max-width:1320px;margin:0 auto;padding:0 28px;display:flex;gap:2px;overflow-x:auto}
.tab{border:0;background:none;padding:14px 14px 12px;font-size:13.5px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--primary)}
.tab .tn{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.tab .tp{font-family:var(--mono);font-size:11px;padding:1px 5px;background:var(--grey-soft);color:var(--muted)}
.tab .tp.done{background:var(--ok-soft);color:var(--ok)}
.tabsep{width:1px;background:var(--rule-2);margin:10px 8px;flex:none}

/* ---------- página ---------- */
.page{max-width:1320px;margin:0 auto;padding:28px 28px 90px}
.kicker{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);font-weight:600}
.title{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--rule);margin-bottom:22px}
.title h1{font-size:25px;margin-top:6px}
.title p{margin:6px 0 0;color:var(--muted);max-width:760px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--ink-2);background:var(--surface);padding:8px 16px;font-weight:500;font-size:13.5px;border-radius:2px}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{background:#0a4b3f}
.btn.small{padding:5px 12px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:2px}
.panel>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px;border-bottom:1px solid var(--rule-2)}
.panel>header h3{font-size:12px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.panel>header small{color:var(--faint);font-size:12px}
.panel .pad{padding:14px 16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.main-side{grid-template-columns:minmax(0,1fr) 400px;align-items:start}
.hint{color:var(--muted);font-size:12.5px}
.empty{color:var(--faint);font-size:13px;padding:18px 0;text-align:center}
.hide{display:none!important}

/* ---------- indicadores ---------- */
.kpi{padding:14px 16px;border-left:3px solid var(--primary)}
.kpi .v{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .l{color:var(--muted);font-size:12.5px}
.kpi.ok{border-left-color:var(--ok)} .kpi.warn{border-left-color:var(--warn)} .kpi.info{border-left-color:var(--info)} .kpi.bad{border-left-color:var(--bad)}

/* ---------- tablas ---------- */
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-weight:600;font-size:11px;font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
  padding:8px 12px;border-bottom:1px solid var(--rule);background:var(--sunken)}
.t td{padding:9px 12px;border-bottom:1px solid var(--rule-2);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t .r{text-align:right;font-variant-numeric:tabular-nums}
.t tr.click{cursor:pointer} .t tr.click:hover td{background:var(--sunken)}
.box{border:1px solid var(--rule-2);overflow:auto}

/* ---------- estados ---------- */
.s{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.03em;padding:1px 6px;border:1px solid var(--rule);color:var(--muted);background:var(--surface);white-space:nowrap}
.s.APPROVED,.s.PAID,.s.AUTO_FIXED{color:var(--ok);border-color:#b6d6c1;background:var(--ok-soft)}
.s.PENDING,.s.AWAITING_PAYMENT{color:var(--warn);border-color:#e3cfa3;background:var(--warn-soft)}
.s.UNKNOWN,.s.REQUIRES_REVIEW,.s.OPEN{color:var(--info);border-color:#cbc5ea;background:var(--info-soft)}
.s.DECLINED,.s.FAILED,.s.CANCELLED{color:var(--bad);border-color:#e6bdb7;background:var(--bad-soft)}
.src{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--muted)}
.src.WEBHOOK{color:#1f4fb3} .src.RECONCILIATION{color:var(--info)} .src.SETTLEMENT{color:var(--ok)}
.http{font-family:var(--mono);font-size:12px;font-weight:600}
.http.c2{color:var(--ok)} .http.c4{color:var(--warn)} .http.c5{color:var(--bad)}
.verb{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted)}

/* ---------- procedimiento ---------- */
.step{display:grid;grid-template-columns:54px minmax(0,1fr);position:relative}
.step:before{content:"";position:absolute;left:26px;top:0;bottom:0;width:1px;background:var(--rule)}
.step:first-child:before{top:22px} .step:last-child:before{bottom:calc(100% - 22px)}
.num{position:relative;z-index:1;margin-top:12px;width:36px;height:22px;justify-self:center;display:grid;place-items:center;
  font-family:var(--mono);font-size:11.5px;font-weight:600;background:var(--paper);border:1px solid var(--rule);color:var(--muted)}
.step.ok .num{background:var(--ok);border-color:var(--ok);color:#fff}
.step.fail .num{background:var(--bad);border-color:var(--bad);color:#fff}
.step.running .num{background:var(--primary);border-color:var(--primary);color:#fff}
.sc{background:var(--surface);border:1px solid var(--rule);border-radius:2px;margin:0 0 10px}
.step.running .sc{border-color:var(--primary);box-shadow:inset 3px 0 0 var(--primary)}
.sh{display:flex;align-items:flex-start;gap:12px;padding:12px 14px}
.sh .tt{flex:1;min-width:0}
.sh h3{font-size:14.5px}
.exp{font-size:12.5px;color:var(--muted);margin-top:1px}
.exp b{font-weight:500;color:var(--ink-2)}
.lab{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.06em;padding-top:6px;color:var(--faint);white-space:nowrap}
.step.ok .lab{color:var(--ok)} .step.fail .lab{color:var(--bad)} .step.running .lab{color:var(--primary)}
.sb{padding:0 14px 14px}
.sb p{margin:0 0 8px}
.why{border-left:3px solid var(--rule);padding:2px 0 2px 12px;color:var(--muted);font-size:13px}
.why b{color:var(--ink-2)}
.out{margin-top:12px;display:none}
.step.ran .out{display:block}
.verdict{padding:9px 12px;font-size:13.5px;font-weight:500;border-left:3px solid;margin-bottom:10px}
.verdict.ok{background:var(--ok-soft);border-color:var(--ok);color:#145a33}
.verdict.fail{background:var(--bad-soft);border-color:var(--bad);color:#8a1f17}
.verdict.run{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.meter{height:4px;background:#cfe0d9;margin-top:7px}
.meter i{display:block;height:100%;background:var(--primary);transition:width .4s}
.calls td{font-size:12.5px}
.calls .ep{font-family:var(--mono);font-size:12px;color:var(--ink-2);word-break:break-all}
.detail td{background:var(--sunken);padding:10px 12px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dgrid h5{margin:0 0 5px;font-size:10.5px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
pre.json{margin:0;padding:10px 12px;background:var(--surface);border:1px solid var(--rule-2);overflow:auto;max-height:300px;
  font-family:var(--mono);font-size:11.5px;line-height:1.55}
.k{color:var(--k)} .sv{color:var(--s)} .nv{color:var(--n)} .bv{color:var(--b)} .zv{color:var(--z)}
.extra{margin-top:10px}

/* ---------- lateral ---------- */
.side{position:sticky;top:64px;display:grid;gap:14px}
dl.kv{display:grid;grid-template-columns:auto 1fr;margin:0;font-size:13px}
.kv dt,.kv dd{padding:6px 0;border-bottom:1px solid var(--rule-2);margin:0}
.kv dt{color:var(--muted)} .kv dd{text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv dt:nth-last-child(2),.kv dd:last-child{border-bottom:0}
.picker{display:flex;border:1px solid var(--rule);margin-bottom:10px}
.picker button{flex:1;border:0;border-right:1px solid var(--rule);background:var(--surface);padding:6px 0;font-family:var(--mono);font-size:12px;font-weight:600}
.picker button:last-child{border-right:0}
.picker button.on{background:var(--ink);color:#fff}
svg text{font-family:var(--mono)}
.chart-row{display:grid;grid-template-columns:170px 1fr 70px;gap:10px;align-items:center;font-size:12.5px;padding:4px 0}
.chart-row .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chart-row .bar{height:14px;background:var(--grey-soft);display:flex}
.chart-row .bar i{display:block;height:100%}
.chart-row .vv{font-family:var(--mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}

/* ---------- eventos ---------- */
.tree,.tree ul{list-style:none;margin:0;padding-left:16px;font-family:var(--mono);font-size:11.5px;line-height:1.6}
.tree{padding:10px 12px;background:var(--surface);border:1px solid var(--rule-2)}
.tree ul{border-left:1px dotted var(--rule)}
.tg{cursor:pointer;color:var(--faint);user-select:none;display:inline-block;width:13px}
.closed>ul{display:none}
.evtype{font-weight:600}
.evtype.PaymentStatusChanged{color:#1f4fb3} .evtype.OrderPaid{color:var(--ok)} .evtype.RefundRequired{color:var(--bad)} .evtype.PaymentNeedsReview{color:var(--warn)}
.input{border:1px solid var(--rule);background:var(--surface);padding:7px 11px;font:inherit;min-width:280px;border-radius:2px}
.ok-mark{color:var(--ok);font-weight:700}
.linkbtn{border:0;background:none;padding:0;color:var(--primary);text-decoration:underline;text-underline-offset:2px;font-size:12.5px}

@media (max-width:1150px){.main-side{grid-template-columns:1fr}.side{position:static}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){.page{padding:20px 16px 60px}.masthead .in,.tabs .in{padding:0 16px}.status,.mark span{display:none}
  .g2,.g4,.dgrid{grid-template-columns:1fr}.chart-row{grid-template-columns:110px 1fr 54px}}
</style>
</head>
<body>
<div class="masthead"><div class="in">
  <div class="mark"><svg width="22" height="22" viewBox="0 0 32 32"><rect width="32" height="32" fill="#0d5c4d"/><path d="M8 22V10h9a5 5 0 010 10h-6" stroke="#fff" stroke-width="3" fill="none"/></svg>
    <b>PAYMENT SERVICE</b><span>Consola de verificación · Integración asíncrona con pasarela de pagos</span></div>
  <div class="status" id="status"></div>
</div></div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div class="page" id="page"></div>

<script>
/* ================================================================ utilidades */
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const short = id => id ? '…' + String(id).slice(-8) : '—';
const money = n => n == null ? '—' : '$ ' + Number(n).toLocaleString('es-CO') + ' COP';
const today = () => new Date().toISOString().slice(0, 10);
const hhmmss = t => t ? new Date(t).toLocaleTimeString('es-CO', {hour12: false}) : '';
const st = s => s ? `<span class="s ${esc(s)}">${esc(s)}</span>` : '<span class="s">—</span>';

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} :
    {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(body)});
  const text = await r.text();
  let j;
  try { j = text ? JSON.parse(text) : null; } catch { j = null; }
  if (j === null) throw new Error(`respuesta vacía o inválida de la consola (HTTP ${r.status}); reintenta el paso`);
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
// Llamada larga: corre en el servidor de la consola y aquí se consulta hasta que termina.
async function apiLong(body, maxMs = 60000) {
  const {job} = await api('/api/service', {...body, async: true});
  const t0 = Date.now();
  while (Date.now() - t0 < maxMs) {
    await sleep(500);
    let s; try { s = await api('/api/job?id=' + job); } catch { continue; }
    if (s.done) { if (s.result.error) throw new Error(s.result.error); return s.result; }
  }
  throw new Error('la llamada no terminó en ' + maxMs / 1000 + ' s');
}
function jsonHtml(o) {
  if (o === undefined) return '<span class="zv">(sin cuerpo)</span>';
  return esc(JSON.stringify(o, null, 2)).replace(
    /(&quot;(?:[^&]|&(?!quot;))*?&quot;)(\s*:)?|\b(true|false)\b|\bnull\b|-?\d+(?:\.\d+)?/g,
    (m, str, colon, bool) => str ? (colon ? `<span class="k">${str}</span>${colon}` : `<span class="sv">${str}</span>`)
      : bool ? `<span class="bv">${m}</span>` : m === 'null' ? '<span class="zv">null</span>' : `<span class="nv">${m}</span>`);
}
function treeHtml(v, key) {
  const k = key === undefined ? '' : `<span class="k">"${esc(key)}"</span>: `;
  if (v !== null && typeof v === 'object') {
    const arr = Array.isArray(v), e = arr ? v.map((x, i) => [i, x]) : Object.entries(v);
    return `<li><span class="tg" onclick="const l=this.parentNode;l.classList.toggle('closed');this.textContent=l.classList.contains('closed')?'+':'−'">−</span>${k}${arr ? '[' : '{'}<ul>${
      e.map(([kk, vv]) => treeHtml(vv, arr ? undefined : kk)).join('')}</ul>${arr ? ']' : '}'}</li>`;
  }
  const cls = v === null ? 'zv' : typeof v === 'string' ? 'sv' : typeof v === 'number' ? 'nv' : 'bv';
  return `<li>${k}<span class="${cls}">${esc(typeof v === 'string' ? '"' + v + '"' : v)}</span></li>`;
}

/* =================================================== llamadas registradas */
function recorder(step) {
  return {
    async svc(method, path, body, key, label, long) {
      const req = {method, path, body, headers: key ? {'Idempotency-Key': key} : {}};
      const r = long ? await apiLong(req) : await api('/api/service', req);
      step.calls.push({label, method, path, key, req: body, status: r.status, res: r.body, ms: r.ms});
      renderStep(step); return r;
    },
    async hook(args, label) {
      const r = await api('/api/webhook', args);
      step.calls.push({label, method: 'POST', path: '/webhooks/DEMO', req: r.request.body, reqHeaders: r.request.headers,
        status: r.status, res: r.body, ms: r.ms});
      renderStep(step); return r;
    },
    async tool(path, body, label) {
      const r = await api(path, body || {});
      step.calls.push({label, method: 'SIM', path, tool: true, status: r.status || 200, res: r, ms: null});
      renderStep(step); return r;
    },
    progress(text, pct) { step.live = {text, pct}; renderStep(step); },
  };
}
async function waitFor(fn, ok, timeoutMs, onTick) {
  const t0 = Date.now(); let last;
  while (Date.now() - t0 < timeoutMs) {
    try { last = await fn(); } catch (e) { last = undefined; } // un fallo puntual (red, carga) se reintenta
    if (last !== undefined && ok(last)) return {ok: true, value: last, s: Math.round((Date.now() - t0) / 1000)};
    onTick && onTick(last, (Date.now() - t0) / timeoutMs, Math.round((Date.now() - t0) / 1000));
    await sleep(1500);
  }
  return {ok: false, value: last, s: Math.round(timeoutMs / 1000)};
}
const getPayment = id => api('/api/service', {method: 'GET', path: '/payments/' + id}).then(r => r.body);
const getOrder = id => api('/api/service', {method: 'GET', path: '/orders/' + id}).then(r => r.body);
const getHistory = id => api('/api/service', {method: 'GET', path: '/payments/' + id + '/history'}).then(r => Array.isArray(r.body) ? r.body : []);
const pass = (msg, extra) => ({ok: true, msg, extra});
const fail = (msg, extra) => ({ok: false, msg, extra});
const ORDER = {customerId: 'cliente-demo', amountMinor: 150000, currency: 'COP'};
// El escenario de timeout usa otro monto: la demora de la pasarela solo aplica a ese monto.
const ORDER_TIMEOUT = {...ORDER, amountMinor: 175000};

/* ================================================================ escenarios */
const SCENARIOS = [
{
  id: 'flujo', n: 1, nav: 'Pago y duplicados', time: '≈ 20 s',
  title: 'Pago exitoso con notificaciones duplicadas y fuera de orden',
  lead: 'Ciclo de vida completo de una orden y su pago, con los problemas típicos de una pasarela real: reintentos del cliente, doble clic y webhooks falsos, repetidos o tardíos.',
  problem: 'La pasarela notifica por webhook; las notificaciones pueden llegar repetidas, falsificadas o fuera de orden. El cliente puede pulsar "pagar" dos veces.',
  solution: 'Idempotencia en cuatro capas, firma HMAC con anti-replay y una máquina de estados que solo avanza con un UPDATE condicional en Oracle.',
  steps: [
    {title: 'Crear la orden', expect: 'HTTP 201 · orden AWAITING_PAYMENT',
     what: 'El comercio crea una orden de $150.000 COP con una cabecera Idempotency-Key.',
     why: '<b>Por qué importa:</b> la clave se guarda en Oracle en la misma transacción que la orden.',
     async run(ctx, io) {
       ctx.key = 'orden-' + uid();
       const r = await io.svc('POST', '/orders', ORDER, ctx.key, 'Crear orden');
       ctx.orderId = r.body?.id; track(ctx, {label: 'Pago', orderId: ctx.orderId});
       return r.status === 201 && r.body.status === 'AWAITING_PAYMENT'
         ? pass(`Orden ${short(ctx.orderId)} creada en AWAITING_PAYMENT.`) : fail('Se esperaba 201.');
     }},
    {title: 'Reintentar con la misma clave', expect: 'HTTP 200 · misma orden',
     what: 'El cliente no recibió la respuesta y repite exactamente la misma petición.',
     why: '<b>Por qué importa:</b> sin idempotencia, cada reintento crearía una orden nueva.',
     async run(ctx, io) {
       const r = await io.svc('POST', '/orders', ORDER, ctx.key, 'Repetir con la misma Idempotency-Key');
       return r.status === 200 && r.body.id === ctx.orderId
         ? pass('Devolvió la misma orden con 200; no se creó nada nuevo.') : fail('Se esperaba la misma orden con 200.');
     }},
    {title: 'Iniciar el pago', expect: 'HTTP 201 · PENDING + URL de redirección',

/* ================================================================== estado */
const state = {view: 'resumen', runs: {}};
function runOf(id) {
  if (!state.runs[id]) {
    const sc = SCENARIOS.find(s => s.id === id);
    state.runs[id] = {ctx: {tracked: []}, steps: sc.steps.map((s, i) => ({...s, i, sc: id, status: 'idle', calls: [], result: null}))};
  }
  return state.runs[id];
}
function track(ctx, t) { ctx.tracked = [t]; refreshTx(ctx); }
const mine = (j, ctx) => (j.messages || []).filter(m => m.payload?.data?.payment?.orderId === ctx.orderId);
const okCount = id => state.runs[id] ? state.runs[id].steps.filter(s => s.status === 'ok').length : 0;

const LABEL = {idle: 'PENDIENTE', running: 'EN CURSO', ok: 'CORRECTO', fail: 'FALLÓ'};

/* ----- máquina de estados (SVG) ----- */
const NODES = {CREATED: [52, 125], PENDING: [180, 55], UNKNOWN: [180, 195], APPROVED: [318, 30], DECLINED: [318, 100], FAILED: [318, 170], EXPIRED: [318, 240]};
const EDGES = [['CREATED','PENDING'],['CREATED','UNKNOWN'],['UNKNOWN','PENDING'],['PENDING','APPROVED'],['PENDING','DECLINED'],['PENDING','EXPIRED'],
  ['UNKNOWN','APPROVED'],['UNKNOWN','DECLINED'],['UNKNOWN','FAILED'],['UNKNOWN','EXPIRED'],['CREATED','FAILED'],['FAILED','APPROVED']];
function stateMachine(hist, current) {
  const walked = new Set(hist.filter(e => e.fromStatus).map(e => e.fromStatus + '>' + e.toStatus));
  const seen = new Set(hist.map(e => e.toStatus));
  const W = 82, H = 24;
  const edge = ([a, b]) => {
    const [x1, y1] = NODES[a], [x2, y2] = NODES[b], on = walked.has(a + '>' + b);
    if (x1 === x2 && Math.abs(y2 - y1) > 80) { // vertical larga (FAILED → APPROVED): rodea por la derecha
      const rx = x1 + W / 2;
      return `<path d="M${rx},${y1} C${rx + 26},${y1} ${rx + 26},${y2} ${rx + 4},${y2}" fill="none" stroke="${on ? '#0d5c4d' : '#d5d2c8'}" stroke-width="${on ? 2.2 : 1}" marker-end="url(#${on ? 'ah-on' : 'ah'})"/>`;
    }
    if (x1 === x2) { // vertical corta (UNKNOWN → PENDING)
      const dir = y2 < y1 ? -1 : 1;
      return `<line x1="${x1}" y1="${y1 + dir * H / 2}" x2="${x2}" y2="${y2 - dir * (H / 2 + 3)}" stroke="${on ? '#0d5c4d' : '#d5d2c8'}" stroke-width="${on ? 2.2 : 1}" marker-end="url(#${on ? 'ah-on' : 'ah'})"/>`;
    }
    const back = x2 < x1;
    const sx = back ? x1 - W / 2 : x1 + W / 2, ex = back ? x2 + W / 2 + 3 : x2 - W / 2 - 3, mx = (sx + ex) / 2;
    const bend = back ? `M${sx},${y1} C${sx - 30},${y1 + 40} ${ex + 30},${y2 + 40} ${ex},${y2}` : `M${sx},${y1} C${mx},${y1} ${mx},${y2} ${ex},${y2}`;
    return `<path d="${bend}" fill="none" stroke="${on ? '#0d5c4d' : '#d5d2c8'}" stroke-width="${on ? 2.2 : 1}" marker-end="url(#${on ? 'ah-on' : 'ah'})"/>`;
  };
  const node = ([name, [x, y]]) => {
    const cur = name === current, was = seen.has(name);
    const fill = cur ? '#0d5c4d' : was ? '#e2eee9' : '#ffffff', stroke = cur || was ? '#0d5c4d' : '#c9c6bb', color = cur ? '#ffffff' : was ? '#0d5c4d' : '#8b9096';
    return `<rect x="${x - W / 2}" y="${y - H / 2}" width="${W}" height="${H}" fill="${fill}" stroke="${stroke}"/>
      <text x="${x}" y="${y + 4}" text-anchor="middle" font-size="10" font-weight="600" fill="${color}">${name}</text>`;
  };
  const extra = [...walked].map(k => k.split('>')).filter(([a, b]) => NODES[a] && NODES[b] && !EDGES.some(e => e[0] === a && e[1] === b));
  return `<svg viewBox="0 0 392 262" width="100%" role="img" aria-label="Máquina de estados del pago">
    <defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c9c6bb"/></marker>
    <marker id="ah-on" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0d5c4d"/></marker></defs>
    ${EDGES.map(edge).join('')}${extra.map(edge).join('')}${Object.entries(NODES).map(node).join('')}</svg>
    <div class="legend" style="margin:6px 0 0"><span><i style="background:#0d5c4d"></i>Estado actual</span><span><i style="background:#e2eee9;border:1px solid #0d5c4d"></i>Visitado</span><span><i style="background:#fff;border:1px solid #c9c6bb"></i>Posible</span></div>`;
}

async function refreshTx(ctx) {
  const box = $('#tx'); if (!box) return;
  const list = ctx.tracked || [];
  if (!list.length) {
    box.innerHTML = `<div class="panel"><header><h3>Transacción</h3></header><div class="pad empty">Ejecuta el primer paso para ver la orden, el pago, su recorrido por la máquina de estados y el historial en Oracle.</div></div>
      <div class="panel"><header><h3>Máquina de estados del pago</h3><small>tabla 5.1</small></header><div class="pad">${stateMachine([], null)}</div></div>`;
    return;
  }
  try {
    const data = await Promise.all(list.map(async t => ({...t, o: t.orderId ? await getOrder(t.orderId) : null,
      p: t.attemptId ? await getPayment(t.attemptId) : null})));
    const sel = list.length > 1 ? data.find(d => d.label === ctx.sel) || data[0] : data[0];
    const hist = sel.attemptId ? await getHistory(sel.attemptId) : [];
    if ($('#tx') !== box) return;
    const run = state.runs[state.view];

    const picker = data.length > 1 ? `<div class="picker">${data.map(d => `<button class="${d === sel ? 'on' : ''}" onclick="selTx('${d.label}')">Pago ${d.label}</button>`).join('')}</div>` : '';
    box.innerHTML = `
      <div class="panel"><header><h3>Transacción</h3><small>${data.length > 1 ? data.length + ' pagos en este escenario' : 'en vivo'}</small></header><div class="pad">${picker}
        <dl class="kv"><dt>Orden</dt><dd class="mono" title="${esc(sel.orderId)}">${short(sel.orderId)}</dd>
        <dt>Estado de la orden</dt><dd>${st(sel.o?.status)}</dd>
        <dt>Intento de pago</dt><dd class="mono" title="${esc(sel.attemptId)}">${short(sel.attemptId)}</dd>
        <dt>Estado del pago</dt><dd>${st(sel.p?.status)}</dd>
        <dt>Id en la pasarela</dt><dd class="mono">${esc(sel.p?.providerPaymentId || '—')}</dd>
        <dt>Monto</dt><dd>${money(sel.o?.amountMinor)}</dd></dl></div></div>
      <div class="panel"><header><h3>Máquina de estados del pago</h3><small>tabla 5.1</small></header><div class="pad">${stateMachine(hist, sel.p?.status)}</div></div>
      <div class="panel"><header><h3>Historial en Oracle</h3><small>payment_status_history</small></header>${hist.length ? `<table class="t">
        <tr><th>Hora</th><th>Transición</th><th>Origen</th></tr>${hist.map(e => `<tr><td class="mono">${hhmmss(e.occurredAt)}</td>
        <td>${e.fromStatus ? st(e.fromStatus) + ' → ' : ''}${st(e.toStatus)}</td><td><span class="src ${e.source}">${e.source}</span></td></tr>`).join('')}</table>`
        : '<div class="pad empty">Sin transiciones todavía.</div>'}</div>
      ${calls.length ? `<div class="panel"><header><h3>Tiempo de respuesta</h3><small>últimas llamadas, en ms</small></header><div class="pad">${latencyChart(calls)}</div></div>` : ''}`;
  } catch (e) { /* panel informativo: se reintenta en el próximo paso */ }
}
function latencyChart(calls) {
  const last = calls.slice(-12), max = Math.max(...last.map(c => c.ms), 1);
  return last.map(c => {
    const color = c.status >= 500 ? 'var(--bad)' : c.status >= 400 ? 'var(--warn)' : 'var(--primary)';
    return `<div class="chart-row"><span class="lb" title="${esc(c.label)}">${esc(c.label)}</span>
      <span class="bar"><i style="width:${Math.max(1.5, c.ms / max * 100)}%;background:${color}"></i></span><span class="vv">${c.ms.toLocaleString('es-CO')}</span></div>`;
  }).join('') + `<div class="legend" style="margin:8px 0 0"><span><i style="background:var(--primary)"></i>2xx</span><span><i style="background:var(--warn)"></i>4xx (rechazo esperado)</span></div>`;
}
function selTx(label) { const ctx = runOf(state.view).ctx; ctx.sel = label; refreshTx(ctx); }

/* ================================================================== ejecución */
let busy = false;
function setBusy(b) {
  busy = b; document.querySelectorAll('[data-run]').forEach(x => x.disabled = b);
  const run = state.runs[state.view]; if (run) run.steps.forEach(renderStep);
}
async function execStep(s, ctx) {
  s.status = 'running'; s.calls = []; s.result = null; s.live = null; renderStep(s); renderTabs();
  document.getElementById('step-' + s.i)?.scrollIntoView({behavior: 'smooth', block: 'nearest'});
  try { s.result = await s.run(ctx, recorder(s)); }
  catch (e) { s.result = fail('Error: ' + e.message + '. Revisa los indicadores de estado arriba a la derecha.'); }
  s.status = s.result.ok ? 'ok' : 'fail'; s.live = null;
  renderStep(s); renderTabs(); refreshTx(ctx);
  return s.result.ok;
}
async function runStep(id, i) {
  if (busy) return; const run = runOf(id);
  const missing = run.steps.slice(0, i).find(s => s.status !== 'ok');
  if (missing) { alert(`Primero ejecuta el paso ${missing.i + 1}: "${missing.title}".`); return; }
  setBusy(true); await execStep(run.steps[i], run.ctx); setBusy(false);
}
async function runScenario(id) {
  if (busy) return; const run = runOf(id); setBusy(true);
  for (const s of run.steps) { if (s.status === 'ok') continue; if (!await execStep(s, run.ctx)) break; await sleep(400); }
  setBusy(false);
}
function resetScenario(id) { if (busy) return; delete state.runs[id]; renderTabs(); render(); }
async function runAll() {
  if (busy) return;
  for (const sc of SCENARIOS) { go(sc.id); await sleep(300); await runScenario(sc.id); if (runOf(sc.id).steps.some(s => s.status === 'fail')) return; }
  go('requisitos');
}

    <p>Arquitectura, máquinas de estado, modelo de datos, secuencias, idempotencia, resiliencia, seguridad, observabilidad, pruebas, supuestos y DDL completo de Oracle. Es el mismo contenido del PDF y del Word.</p></div>
    <div class="btns"><a class="btn" href="${DOC}.html" target="_blank" style="text-decoration:none;color:inherit">Abrir en otra pestaña</a>
    <a class="btn" href="${DOC}.docx" style="text-decoration:none;color:inherit">Descargar Word</a>
    <a class="btn primary" href="${DOC}.pdf" style="text-decoration:none">Descargar PDF</a></div></div>
    <div class="grid g4" style="margin-bottom:16px">${[['s4', 'Arquitectura', 'Componentes y responsabilidades'], ['s7', 'Secuencias', 'Éxito, timeout y webhooks'],
      ['s6', 'Modelo de datos', 'Tablas, restricciones e índices'], ['s9', 'Resiliencia', 'Reintentos, timeouts y conciliación']].map(([a, t, d]) =>
      `<button class="panel kpi" style="text-align:left;cursor:pointer" onclick="docJump('${a}')"><div style="font-weight:600">${t}</div><div class="l">${d} · §${a.slice(1)}</div></button>`).join('')}</div>
    <iframe id="docframe" src="${DOC}.html${state.anchor ? '#' + state.anchor : ''}" title="Documento de diseño"
      style="width:100%;height:calc(100vh - 150px);min-height:640px;border:1px solid var(--rule);background:#fff"></iframe>`;
}
function docJump(anchor) {
  const f = $('#docframe');
  try { f.contentWindow.location.hash = anchor; } catch { f.src = DOC + '.html#' + anchor; }
  f.scrollIntoView({behavior: 'smooth', block: 'start'});
}
function docRefs(text) {
  return text.replace(/§(\d+)(?:\.(\d+))?(?:–\d+(?:\.\d+)?)?|Anexo ([A-Z])|docs\/entrega/g, (m, a, b, x) => {
    const id = x ? 'anexo-' + x.toLowerCase() : a ? 's' + a + (b ? '-' + b : '') : '';
    return `<button class="linkbtn mono" onclick="go('documento','${id}')">${m}</button>`;
  });
}

/* ==================================================================== métricas */
function renderMetrics() {
  $('#page').innerHTML = `<div class="title"><div><div class="kicker">Observabilidad · §11</div><h1>Métricas del servicio</h1>
    <p>Leídas en vivo de <span class="mono">/actuator/prometheus</span>, las mismas que alimentarían paneles y alertas en Grafana. Se actualizan cada 5 segundos.</p></div>
    <div class="btns"><span class="hint" id="m-at"></span></div></div><div id="m-body"><div class="empty">Cargando…</div></div>`;
  drawMetrics(); state.metricsTimer = setInterval(drawMetrics, 5000);
}
async function drawMetrics() {
  let m; try { m = (await api('/api/metrics')).metrics; } catch (e) { if ($('#m-body')) $('#m-body').innerHTML = `<div class="empty">No se pudieron leer las métricas: ${esc(e.message)}</div>`; return; }
  if (state.view !== 'metricas') return;
  const pick = n => m.filter(x => x.name === n), sum = n => pick(n).reduce((a, x) => a + x.value, 0);
  const tr = pick('payments_transitions_total');
  const bySource = {}; tr.forEach(x => { const k = x.labels.source; bySource[k] = bySource[k] || {applied: 0, ignored: 0}; bySource[k][x.labels.result] = (bySource[k][x.labels.result] || 0) + x.value; });
  const byTarget = {}; tr.filter(x => x.labels.result === 'applied').forEach(x => byTarget[x.labels.to] = (byTarget[x.labels.to] || 0) + x.value);
  const cb = pick('resilience4j_circuitbreaker_state').find(x => x.value === 1)?.labels.state || '—';
  const reqS = pick('http_server_requests_seconds_sum');
  const reqs = pick('http_server_requests_seconds_count').filter(x => !x.labels.uri.startsWith('/actuator')).map(x => ({uri: x.labels.uri, method: x.labels.method, status: x.labels.status, n: x.value,
    avg: (reqS.find(y => y.labels.uri === x.labels.uri && y.labels.method === x.labels.method && y.labels.status === x.labels.status)?.value || 0) / x.value * 1000}))
    .sort((a, b) => b.n - a.n);
  const bars = (rows, colors) => { const max = Math.max(1, ...rows.map(r => r.parts.reduce((a, p) => a + p, 0)));
    return rows.length ? rows.map(r => `<div class="chart-row"><span class="lb">${r.label}</span><span class="bar">${
      r.parts.map((p, i) => `<i style="width:${p / max * 100}%;background:${colors[i]}"></i>`).join('')}</span><span class="vv">${r.parts.reduce((a, p) => a + p, 0)}</span></div>`).join('')
      : '<div class="empty">Sin datos todavía: ejecuta un escenario.</div>'; };
  const SRC = ['API', 'WEBHOOK', 'RECONCILIATION', 'SETTLEMENT'];
  if (!$('#m-body')) return; // el usuario cambió de pestaña mientras cargaba
  $('#m-body').innerHTML = `
    <div class="grid g4" style="margin-bottom:16px">
      <div class="panel kpi"><div class="v">${tr.filter(x => x.labels.result === 'applied').reduce((a, x) => a + x.value, 0)}</div><div class="l">Transiciones aplicadas</div></div>
      <div class="panel kpi warn"><div class="v">${sum('payments_webhook_duplicates_total')}</div><div class="l">Webhooks duplicados descartados</div></div>
      <div class="panel kpi bad"><div class="v">${sum('payments_webhook_signature_failures_total')}</div><div class="l">Firmas inválidas rechazadas</div></div>
      <div class="panel kpi ${cb === 'closed' ? 'ok' : 'bad'}"><div class="v" style="text-transform:uppercase">${esc(cb)}</div><div class="l">Circuit breaker hacia la pasarela</div></div></div>
    <div class="grid g2" style="margin-bottom:16px">
      <div class="panel"><header><h3>Transiciones por origen</h3><small>payments_transitions_total</small></header><div class="pad">
        <div class="legend"><span><i style="background:var(--primary)"></i>Aplicadas</span><span><i style="background:#c9c6bb"></i>Ignoradas (duplicadas o fuera de orden)</span></div>
        ${bars(SRC.filter(s => bySource[s]).map(s => ({label: s, parts: [bySource[s].applied || 0, bySource[s].ignored || 0]})), ['var(--primary)', '#c9c6bb'])}</div></div>
      <div class="panel"><header><h3>Estados alcanzados</h3><small>transiciones aplicadas por destino</small></header><div class="pad">
        ${bars(Object.entries(byTarget).sort((a, b) => b[1] - a[1]).map(([k, v]) => ({label: k, parts: [v]})), ['var(--info)'])}</div></div></div>
    <div class="grid g2">
      <div class="panel"><header><h3>Eventos publicados por tipo</h3><small>payments_outbox_published_total</small></header><div class="pad">
        ${bars(pick('payments_outbox_published_total').map(x => ({label: x.labels.type, parts: [x.value]})), ['var(--ok)'])}
        <div class="hint" style="margin-top:10px">No enrutables reintentados: <b>${sum('payments_outbox_unroutable_total')}</b> · Corregidos por la liquidación: <b>${sum('payments_settlement_auto_fixed_total')}</b></div></div></div>
      <div class="panel"><header><h3>Peticiones HTTP</h3><small>http_server_requests</small></header>
        ${reqs.length ? `<table class="t"><tr><th>Endpoint</th><th class="r">HTTP</th><th class="r">Cantidad</th><th class="r">Promedio</th></tr>${reqs.slice(0, 10).map(r => {
          const cls = r.status >= 500 ? 'c5' : r.status >= 400 ? 'c4' : 'c2';
          return `<tr><td class="mono"><span class="verb">${r.method}</span> ${esc(r.uri)}</td><td class="r"><span class="http ${cls}">${r.status}</span></td><td class="r mono">${r.n}</td><td class="r mono">${r.avg.toFixed(0)} ms</td></tr>`; }).join('')}</table>`
          : '<div class="pad empty">Sin peticiones todavía.</div>'}</div></div>`;
  if ($('#m-at')) $('#m-at').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-CO', {hour12: false});
}

/* ===================================================================== eventos */
async function renderEvents() {
  $('#page').innerHTML = `<div class="title"><div><div class="kicker">Mensajería · §4.3</div><h1>Eventos publicados en RabbitMQ</h1>
    <p>Lo que reciben los demás sistemas. Cada evento viaja en un sobre con eventId (deduplicación), tipo, versión del esquema, fecha y correlationId. Pulsa una fila para ver el JSON.</p></div>
    <div class="btns"><button class="btn" onclick="if(confirm('¿Vaciar la cola de demostración?'))api('/api/events/purge',{}).then(renderEvents)">Vaciar cola</button>
    <button class="btn primary" onclick="renderEvents()">Actualizar</button></div></div>
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap"><input class="input" id="evf" placeholder="Filtrar por tipo, orderId o estado"><span class="hint" id="evn"></span></div>
    <div id="evlist"><div class="empty">Cargando…</div></div>`;
  try {
    const j = await api('/api/events'), list = (j.messages || []).slice().reverse();
    const draw = () => {
      if (!$('#evlist')) return; // el usuario cambió de pestaña mientras cargaba
      const q = ($('#evf')?.value || '').toLowerCase();
      const f = list.filter(x => !q || JSON.stringify(x).toLowerCase().includes(q));
      $('#evn').textContent = `${f.length} de ${list.length} eventos · cola ${j.queue} · más recientes primero`;
      $('#evlist').innerHTML = f.length ? eventsTable(f) : '<div class="empty">No hay eventos. Ejecuta un escenario.</div>';
    };
    $('#evf')?.addEventListener('input', draw); draw();
  } catch (e) { if ($('#evlist')) $('#evlist').innerHTML = `<div class="empty">No se pudo leer RabbitMQ: ${esc(e.message)}</div>`; }
}

/* ================================================================== requisitos */
function renderReqs() {
  const link = ([id, i]) => id === 'metricas' ? `<button class="linkbtn" onclick="go('metricas')">Métricas</button>`
    : `<button class="linkbtn" onclick="go('${id}',${i})">Escenario ${SCENARIOS.find(s => s.id === id).n} · paso ${i + 1}</button>`;
  const stepOk = ([id, i]) => id === 'metricas' || (state.runs[id] && state.runs[id].steps[i]?.status === 'ok');
  const groups = [['Funcional', 'Requisitos funcionales · §4 del enunciado'], ['No funcional', 'Requisitos no funcionales · §5'],
    ['Entregable', 'Entregables obligatorios · §6'], ['Formato', 'Formato y criterios · §7 y §9']];
  const done = REQS.filter(r => !r[4].length || r[4].every(stepOk)).length;
  $('#page').innerHTML = `<div class="title"><div><div class="kicker">Trazabilidad del enunciado</div><h1>Requisitos de la prueba técnica</h1>
    <p>Cada punto del enunciado con su solución, la sección del documento de diseño donde se explica y el paso de esta consola que lo demuestra. "Verificado" se marca al ejecutar los escenarios.</p></div>
    <div class="btns"><span class="hint"><b>${done}</b> de ${REQS.length} verificados</span><button class="btn primary" data-run onclick="runAll()">Ejecutar la verificación completa</button></div></div>
    ${groups.map(([g, title]) => `<div class="panel" style="margin-bottom:16px"><header><h3>${title}</h3></header>
      <table class="t"><tr><th style="width:30%">Requisito</th><th>Cómo se cumple</th><th>Documento</th><th>Demostración</th><th class="r">Verificado</th></tr>
      ${REQS.filter(r => r[0] === g).map(([, req, how, doc, demos]) => {
        const v = !demos.length || demos.every(stepOk);
        const first = (doc.match(/§(\d+)(?:\.(\d+))?|Anexo ([A-Z])/) || []);
        const anchor = first[3] ? 'anexo-' + first[3].toLowerCase() : first[1] ? 's' + first[1] + (first[2] ? '-' + first[2] : '') : '';
        return `<tr><td><b>${req}</b></td><td class="hint">${how}</td><td>${docRefs(doc)}</td><td>${demos.map(link).join('<br>') || `<button class="linkbtn" onclick="go('documento','${anchor}')">Ver en el documento</button>`}</td>
          <td class="r">${v ? '<span class="ok-mark">✓</span>' : '<span class="hint">pendiente</span>'}</td></tr>`; }).join('')}
      </table></div>`).join('')}`;
  setBusy(busy);
}

/* ====================================================================== salud */
async function health() {
  try {
    const h = await api('/api/health');
    const it = (ok, n) => `<span><i class="${ok ? 'up' : 'down'}"></i>${n}</span>`;
    $('#status').innerHTML = it(h.service, 'servicio') + it(h.broker, 'rabbitmq') + it(h.gateway, 'pasarela');
  } catch { $('#status').innerHTML = '<span><i class="down"></i>consola sin conexión</span>'; }
}

renderTabs(); render(); health(); setInterval(health, 5000);
</script>
</body>
</html>
